name: product-discovery
version: 2.0.0
author: channel3
description: >
  Search for real product data — prices, availability, merchant links, and
  "more like this" recommendations — across 100M+ products from thousands of
  retailers using the Channel3 CLI (channel3 products search,
  channel3 products find-similar, channel3 categories search,
  channel3 categories retrieve, channel3 brands search). Use when finding
  products, comparing prices, checking availability, or resolving category
  slugs and brand IDs for strict filtering.
license: MIT

permissions:
  - network
  - shell

config:
  CHANNEL3_API_KEY:
    type: string
    required: true
    description: "Channel3 API key — get one free at https://trychannel3.com"
    secret: true

entryPoint:
  type: natural
  prompt: |
    Follow the instructions in SKILL.md to help the user discover products
    using the Channel3 CLI (`channel3`). Install with
    `brew install channel3-ai/tap/channel3` if not present.
